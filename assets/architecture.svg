<text x="692" y="446" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"><tspan x="692" dy="0">Every weight drifts back toward 1.0. What stops</tspan><tspan x="692" dy="15">arriving slowly becomes new again.</tspan></text>
